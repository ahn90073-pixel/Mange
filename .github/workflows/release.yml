name: Build and Release Mobile Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix, e.g. 1.0.1'
        required: true
        type: string
      build_ios:
        description: 'Build signed iOS IPA (requires Apple signing secrets)'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  NODE_VERSION: '22.x'
  JAVA_VERSION: '21'
  ANDROID_KEYSTORE_PATH: android/mange-release.jks

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${REF_NAME}" == v* ]]; then
            VERSION="${REF_NAME#v}"
          else
            echo "For manual runs, provide a version such as 1.0.1." >&2
            exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid version: $VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  android:
    name: Build signed Android APK and AAB
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies and build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64 repository secret." >&2
            exit 1
          }
          KEYSTORE_VALUE="$ANDROID_KEYSTORE_BASE64"
          if [[ "$KEYSTORE_VALUE" == *ANDROID_KEYSTORE_BASE64=* ]]; then
            KEYSTORE_VALUE="${KEYSTORE_VALUE#*ANDROID_KEYSTORE_BASE64=}"
            if [[ "$KEYSTORE_VALUE" == *$'\n'ANDROID_KEYSTORE_PASSWORD=* ]]; then
              KEYSTORE_VALUE="${KEYSTORE_VALUE%%$'\n'ANDROID_KEYSTORE_PASSWORD=*}"
            fi
          fi
          KEYSTORE_VALUE="${KEYSTORE_VALUE//\"/}"
          KEYSTORE_VALUE="${KEYSTORE_VALUE//\'/}"
          KEYSTORE_VALUE="$(printf '%s' "$KEYSTORE_VALUE" | tr -cd 'A-Za-z0-9+/=')"
          REMAINDER=$(( ${#KEYSTORE_VALUE} % 4 ))
          if [[ "$REMAINDER" == 2 ]]; then KEYSTORE_VALUE="${KEYSTORE_VALUE}=="; fi
          if [[ "$REMAINDER" == 3 ]]; then KEYSTORE_VALUE="${KEYSTORE_VALUE}="; fi
          printf '%s' "$KEYSTORE_VALUE" | base64 --decode --ignore-garbage > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          clean_secret() {
            local value="$1"
            if [[ "$value" == *=* ]]; then value="${value#*=}"; fi
            value="${value%%$'\n'*}"
            value="${value//\"/}"
            value="${value//\'/}"
            printf '%s' "$value" | tr -d '[:space:]'
          }
          STORE_PASSWORD="$(clean_secret "$ANDROID_KEYSTORE_PASSWORD")"
          KEY_ALIAS="$(clean_secret "$ANDROID_KEY_ALIAS")"
          KEY_PASSWORD="$(clean_secret "$ANDROID_KEY_PASSWORD")"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          cat > android/keystore.properties <<EOF
          storeFile=mange-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /tmp/keytool-check.log 2>&1; then
            echo "Android keystore validation failed. Check the four Android secrets and ensure each contains only its value."
            sed -E 's/(password|Password|PASS|alias|Alias)[^:]*:.*/\1: [redacted]/' /tmp/keytool-check.log || true
            exit 1
          fi

      - name: Set Android version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'versionCode \d+', f"versionCode {os.environ['VERSION_CODE']}", s, count=1)
          s = re.sub(r'versionName "[^"]+"', f'versionName "{os.environ["VERSION"]}"', s, count=1)
          p.write_text(s)
          PY

      - name: Build signed APK and AAB
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Rename Android artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/Mange-${VERSION}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-assets/Mange-${VERSION}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.prepare.outputs.version }}
          path: release-assets/*
          if-no-files-found: error

  ios:
    name: Build signed iOS IPA
    needs: prepare
    if: ${{ github.event_name == 'push' || inputs.build_ios == true }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies and build web app
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Install Apple signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PROVISIONING_PROFILE_BASE64"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/Mange.mobileprovision"

      - name: Set iOS version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" ios/App/App/Info.plist || true

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          test -n "$IOS_PROFILE_NAME"
          test -n "$IOS_BUNDLE_ID"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF

      - name: Archive iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          test -n "$IOS_PROFILE_NAME"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Mange.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            MARKETING_VERSION="${{ needs.prepare.outputs.version }}" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mange.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p release-assets
          cp "$RUNNER_TEMP/ios-export/"*.ipa "release-assets/Mange-${{ needs.prepare.outputs.version }}.ipa"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.prepare.outputs.version }}
          path: release-assets/*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, android, ios]
    if: ${{ always() && needs.android.result == 'success' && (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.prepare.outputs.version }}
          path: release-assets

      - name: Download iOS artifact
        if: ${{ needs.ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-${{ needs.prepare.outputs.version }}
          path: release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Mange ${{ needs.prepare.outputs.tag }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
